<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <style>
        .container {
            background-color: rgb(0, 0, 0);
            display: grid;
            grid-template-columns: 200px 1fr 1fr;
            grid-template-rows: 100px 200px 200px 100px;
            padding: 10px;
            gap: 10px;
        }
        .item-a {
            background-color: rgb(255, 217, 217);
            color: rgb(0, 0, 0);
            grid-column: 1/4;
            grid-row: 1/2;
            border-radius: 5px;
        }
        .item-b {
            background-color: rgb(255, 217, 217);
            color: rgb(0, 0, 0);
            grid-column: 1/2;
            grid-row: 2/4;
            border-radius: 5px;
        }
        .item-c {
            background-color: rgb(255, 217, 217);
            color: rgb(0, 0, 0);
            grid-column: 2/3;
            grid-row: 2/3;
            border-radius: 5px;
        }
        .item-d {
            background-color: rgb(255, 217, 217);
            color: rgb(0, 0, 0);
            grid-column: 3/4;
            grid-row: 2/3;
            border-radius: 5px;
        }
        .item-e {
            background-color: rgb(255, 217, 217);
            color: rgb(0, 0, 0);
            grid-column: 2/4;
            grid-row: 3/4;
            border-radius: 5px;
        }
        .item-f {
            background-color: rgb(255, 217, 217);
            color: rgb(0, 0, 0);
            grid-column: 1/4;
            grid-row: 4/5;
            border-radius: 5px;
        }
    </style>
<body>
    <div class="container">
        <div class="item-a ">a</div>
        <div class="item-b">b</div>
        <div class="item-c">c</div>
        <div class="item-d ">d</div>
        <div class="item-e">e</div>
        <div class="item-f">f</div>
    </div>
</body>
</html>
